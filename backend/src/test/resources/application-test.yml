# Test profile, used together with "dev" so the demo data is seeded.
# In memory database and a throw away storage directory.
spring:
  datasource:
    # A new database for every test context, so test classes never see each other's data
    url: jdbc:h2:mem:mrms-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1

mrms:
  jobs:
    # Tests run the time limit watch and the message sender by hand, at chosen times
    enabled: false
  esign:
    # Tests sign with passwords unless a test switches eSign on (see EsignIntegrationTests)
    mode: password
    simulator: false
  storage:
    root: ./target/test-storage
  security:
    # Generous limits so the rate limiter does not interfere with test flows
    login-requests-per-minute: 1000
    api-requests-per-minute: 10000

logging:
  level:
    com.mrms: INFO
