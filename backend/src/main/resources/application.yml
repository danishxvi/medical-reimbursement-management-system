# ---------------------------------------------------------------------
# Base configuration. These are the PRODUCTION defaults: secure by
# default, every secret comes from the environment. Local development
# uses the "dev" profile (application-dev.yml).
# ---------------------------------------------------------------------
spring:
  application:
    name: mrms-backend
  datasource:
    url: ${MRMS_DB_URL}
    username: ${MRMS_DB_USERNAME}
    password: ${MRMS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Shared migrations plus database specific ones ({vendor} = postgresql or h2)
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true
  session:
    # Idle timeout, set explicitly: Spring Session does not inherit server.servlet.session.timeout
    timeout: 15m
    # Tables are created by Flyway (db/vendor/*/V5__shared_sessions.sql)
    jdbc:
      initialize-schema: never

server:
  port: ${MRMS_PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* only when running behind the reverse proxy
  forward-headers-strategy: ${MRMS_FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      timeout: 15m
      tracking-modes: cookie
      cookie:
        name: MRMS_SESSION
        http-only: true
        secure: true
        same-site: strict
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail delivery problems show in the outbox (retries, FAILED), not as the whole application being down
    mail:
      enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

mrms:
  cors:
    # Comma separated list. Empty means same origin only (recommended:
    # serve the frontend and API from one domain through the proxy).
    allowed-origins: ${MRMS_ALLOWED_ORIGINS:}
  csrf:
    secure-cookie: true
  storage:
    root: ${MRMS_STORAGE_ROOT:./storage}
    # Base64 encoded 256 bit key for AES-GCM encryption of uploaded files
    encryption-key: ${MRMS_STORAGE_KEY}
    max-file-bytes: 5242880
  security:
    max-failed-logins: 5
    lockout-minutes: 15
    login-requests-per-minute: 10
    api-requests-per-minute: 300
    password-history: 5
  sla:
    hos-days: 3
    pao-audit-days: 7
    sanction-days: 3
    pharmacist-days: 2
    medical-officer-days: 2
    # Remind at 80% of a limit, escalate to the zonal office at twice the limit
    reminder-percent: 80
    escalation-factor: 2
    check-interval: PT15M
  jobs:
    enabled: true
  notifications:
    portal-url: ${MRMS_PUBLIC_BASE_URL:}
    dispatch-interval: PT30S
    # off, log or smtp. For smtp also set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
    email:
      mode: ${MRMS_MAIL_MODE:off}
      from: ${MRMS_MAIL_FROM:}
    # off, log or http. The template takes {mobile}, {message} and {templateId} (DLT template id)
    sms:
      mode: ${MRMS_SMS_MODE:off}
      url-template: ${MRMS_SMS_URL_TEMPLATE:}
      template-id: ${MRMS_SMS_TEMPLATE_ID:}
  claim:
    # DGEHS: claim must be submitted within three months of treatment end
    submission-window-days: 90
    max-items: 50
  documents:
    # Standard names given to uploads. Tokens: {owner} {claim} {category} {date} {seq}
    upload-pattern: ${MRMS_DOC_UPLOAD_PATTERN:{owner}_{category}_{date}_{seq}}
    claim-pattern: ${MRMS_DOC_CLAIM_PATTERN:{claim}_{category}_{seq}}
  antivirus:
    # Every upload is scanned by ClamAV before it is stored
    mode: ${MRMS_AV_MODE:clamd}
    host: ${MRMS_AV_HOST:clamav}
    port: ${MRMS_AV_PORT:3310}
    timeout-millis: 20000
    # Refuse uploads while the scanner is unreachable
    fail-closed: true
    allow-disabled: false
  esign:
    # password (step up with the account password) or esign (Aadhaar eSign through a licensed ESP).
    # eSign needs the Directorate's ASP registration: ASP id, keystore and the ESP's certificates.
    mode: ${MRMS_SIGNING_MODE:password}
    provider-name: ${MRMS_ESP_NAME:}
    asp-id: ${MRMS_ESP_ASP_ID:}
    esp-url: ${MRMS_ESP_URL:}
    public-base-url: ${MRMS_PUBLIC_BASE_URL:}
    request-field: ${MRMS_ESP_REQUEST_FIELD:eSignRequest}
    response-field: ${MRMS_ESP_RESPONSE_FIELD:eSignResponse}
    asp-keystore: ${MRMS_ESP_ASP_KEYSTORE:}
    asp-keystore-password: ${MRMS_ESP_ASP_KEYSTORE_PASSWORD:}
    asp-key-alias: ${MRMS_ESP_ASP_KEY_ALIAS:asp}
    esp-certificates: ${MRMS_ESP_CERTIFICATES:}
    trusted-cas: ${MRMS_ESP_TRUSTED_CAS:}
    simulator: false
    transaction-minutes: 10
  bootstrap:
    # Creates the first administrator if none exists. The account must
    # change its password on first login.
    admin-username: ${MRMS_ADMIN_USERNAME:}
    admin-password: ${MRMS_ADMIN_PASSWORD:}
