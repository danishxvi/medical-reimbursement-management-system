# ---------------------------------------------------------------------
# Production like stack: PostgreSQL, ClamAV, API and web (nginx).
#
#   1. cp .env.example .env   and fill in every value
#   2. docker compose up -d --build
#   3. open http://localhost:8080 (put a TLS gateway in front on a server)
#
# Only the web container is published, and only on the loopback address.
# The database and API are reachable from the internal network alone.
# ---------------------------------------------------------------------
name: mrms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrms
      POSTGRES_USER: ${MRMS_DB_USERNAME:?set MRMS_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${MRMS_DB_PASSWORD:?set MRMS_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mrms"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Virus scanner for every upload. Loading the signature database takes a
  # few minutes on first start and needs about 2 GB of memory. freshclam in
  # the same container keeps signatures current through the "updates" network.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - updates

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      MRMS_DB_URL: jdbc:postgresql://db:5432/mrms
      MRMS_DB_USERNAME: ${MRMS_DB_USERNAME}
      MRMS_DB_PASSWORD: ${MRMS_DB_PASSWORD}
      MRMS_STORAGE_KEY: ${MRMS_STORAGE_KEY:?set MRMS_STORAGE_KEY in .env}
      MRMS_STORAGE_ROOT: /data/storage
      MRMS_ADMIN_USERNAME: ${MRMS_ADMIN_USERNAME:-}
      MRMS_ADMIN_PASSWORD: ${MRMS_ADMIN_PASSWORD:-}
      # nginx in front forwards the client address
      MRMS_FORWARD_HEADERS: native
      MRMS_AV_HOST: clamav
      MRMS_AV_PORT: "3310"
      MRMS_PUBLIC_BASE_URL: ${MRMS_PUBLIC_BASE_URL:-}
      # E-mail and SMS (off by default); see docs/16-deadlines-and-notifications.md
      MRMS_MAIL_MODE: ${MRMS_MAIL_MODE:-off}
      MRMS_MAIL_FROM: ${MRMS_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MRMS_SMS_MODE: ${MRMS_SMS_MODE:-off}
      MRMS_SMS_URL_TEMPLATE: ${MRMS_SMS_URL_TEMPLATE:-}
      MRMS_SMS_TEMPLATE_ID: ${MRMS_SMS_TEMPLATE_ID:-}
      # Signing: password (default) or esign; eSign needs the ASP registration values below
      MRMS_SIGNING_MODE: ${MRMS_SIGNING_MODE:-password}
      MRMS_ESP_NAME: ${MRMS_ESP_NAME:-}
      MRMS_ESP_ASP_ID: ${MRMS_ESP_ASP_ID:-}
      MRMS_ESP_URL: ${MRMS_ESP_URL:-}
      MRMS_ESP_ASP_KEYSTORE: ${MRMS_ESP_ASP_KEYSTORE:-}
      MRMS_ESP_ASP_KEYSTORE_PASSWORD: ${MRMS_ESP_ASP_KEYSTORE_PASSWORD:-}
      MRMS_ESP_CERTIFICATES: ${MRMS_ESP_CERTIFICATES:-}
      MRMS_ESP_TRUSTED_CAS: ${MRMS_ESP_TRUSTED_CAS:-}
    volumes:
      - storage:/data/storage
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${MRMS_WEB_PORT:-8080}:8080"
    environment:
      # Origin of the eSign provider (for example https://esign.example.gov.in); empty when eSign is off
      MRMS_ESP_ORIGIN: ${MRMS_ESP_ORIGIN:-}
    read_only: true
    tmpfs:
      - /tmp
      # nginx writes its rendered configuration here at start up
      - /etc/nginx/conf.d
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - public

volumes:
  db-data:
  storage:
  clamav-db:

networks:
  internal:
    internal: true
  public:
  # Outbound only, for virus signature updates
  updates:
